name: tests

# The suite is the gate. Three documents (CLAUDE.md, evals/README.md) described
# the golden-set scorer as running "on every push" before this file existed —
# so the harness standing between a widened catalogue pattern and a phantom
# limb on every other notice ran only when someone remembered.
#
# The OCR extra is installed deliberately: without it the four end-to-end OCR
# tests skip, and skipping is the base-install configuration, which means they
# had never run anywhere but the machine that wrote them.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (with the OCR extra)
        run: uv sync --extra ocr

      - name: Run the suite
        # OCR_REQUIRED makes the OCR tests fail rather than skip: with the
        # extra installed a skip means the engine is broken, not absent.
        env:
          OCR_REQUIRED: "1"
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
