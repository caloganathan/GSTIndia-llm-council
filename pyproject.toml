[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-docx>=1.2.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# Reading scanned notices. Optional because the base install stays light for
# firms whose notices all arrive as digital PDFs, and because a missing engine
# degrades cleanly — `backend/ocr.py` reports the scan honestly rather than
# guessing at it, exactly as the product did before OCR existed.
#
# Both are ordinary Python wheels with no system binary to install, which is
# why this engine was chosen over Tesseract: `uv sync --extra ocr` is the
# whole instruction on Windows, macOS and Linux alike.
ocr = [
    "pypdfium2>=4.30.0",
    "rapidocr-onnxruntime>=1.3.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
